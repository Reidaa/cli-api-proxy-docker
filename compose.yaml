services:
  cli-api-proxy:
    image: local/cli-api-proxy:${CLI_PROXY_VERSION:-8.0.42}
    build:
      context: .
      args:
        CLI_PROXY_VERSION: ${CLI_PROXY_VERSION:-8.0.42}
    container_name: cli-api-proxy
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /data
      WRITABLE_PATH: /data
      TZ: ${TZ:-UTC}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CLI_PROXY_PORT:-8317}:8317"
      # OAuth callback ports used by the supported CLI providers.
      - "${BIND_ADDRESS:-127.0.0.1}:8085:8085"
      - "${BIND_ADDRESS:-127.0.0.1}:1455:1455"
      - "${BIND_ADDRESS:-127.0.0.1}:54545:54545"
      - "${BIND_ADDRESS:-127.0.0.1}:51121:51121"
      - "${BIND_ADDRESS:-127.0.0.1}:11451:11451"
    volumes:
      # Resolved XDG paths are recorded in .env by install.sh (config in
      # ~/.config/cli-api-proxy, data in ~/.local/share, logs in ~/.local/state).
      # The :z suffix relabels each tree for SELinux so the container can read
      # its files on enforcing hosts (Fedora CoreOS, RHEL, Fedora).
      - "${CLI_PROXY_CONFIG_DIR:-./config}:/config:z"
      - "${CLI_PROXY_DATA_DIR:-./data}:/data:z"
      - "${CLI_PROXY_STATE_DIR:-./data}/logs:/data/logs:z"
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8317/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
